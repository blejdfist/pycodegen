[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycodegen"
version = "0.0.2"
description = "Simple code generation tool with support for multiple types of inputs"
readme = "README.rst"
license = { file = "LICENSE" }
authors = [{ name = "Jim Ekman", email = "jim@nurd.se" }]
keywords = ["code generation", "libclang", "codegenerator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = ["jinja2>=2.10"]

[project.optional-dependencies]
cpp = [
    "asciitree>=0.3.3",
    "libclang>=16,<=20",
]

[dependency-groups]
dev = [
    "nox",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/blejdfist/pycodegen"

[project.scripts]
pycodegen = "pycodegen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pycodegen"]
